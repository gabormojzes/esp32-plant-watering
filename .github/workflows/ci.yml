name: CI

# Every action is pinned to a commit and the ESP-IDF image to a digest, each named by its release.
# What runs then changes only when a commit here changes it. Tool versions are exact wherever their
# source keeps released files unchanged, as PyPI does, and kept in step with
# scripts/checks/Dockerfile.

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install clang-format
        # Pinned to the patch release, the one clang-tidy comes from, because releases within
        # one major version format the same code differently.
        run: pipx install clang-format==22.1.8
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files '*.cpp' '*.hpp' '*.h' ':!test/host/third_party' \
            | xargs clang-format --dry-run --Werror

  host-tests:
    runs-on: ubuntu-24.04
    env:
      # Pinned to the GCC generation the ESP-IDF toolchain builds the firmware
      # with, which holds main/ to the same C++23 in both builds rather than
      # whichever g++ the runner image happens to default to.
      CXX: g++-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install CMake
        run: pipx install cmake==3.31.6
      - name: Configure
        # Warnings fail the build here, where the pinned compiler makes the same
        # code warn the same way every run.
        run: cmake -S test/host -B test/host/build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build test/host/build
      - name: Test
        run: ctest --test-dir test/host/build --output-on-failure

  host-tests-sanitized:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
      # The vendored C libraries must link against the same sanitizer runtime as
      # the tests.
      CC: gcc-14
      ASAN_OPTIONS: detect_stack_use_after_return=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install CMake
        run: pipx install cmake==3.31.6
      - name: Configure
        run: >
          cmake -S test/host -B test/host/build -DSANITIZE=ON
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build test/host/build
      - name: Test
        run: ctest --test-dir test/host/build --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    env:
      # libFuzzer ships with Clang only.
      CC: clang-20
      CXX: clang++-20
      FUZZ_TARGETS: fuzz_command fuzz_login fuzz_cookie fuzz_bearer fuzz_media_type
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 libclang-rt-20-dev
      - name: Install CMake
        run: pipx install cmake==3.31.6
      - name: Configure
        run: cmake -S test/host -B test/host/build -DFUZZ=ON
      - name: Build
        run: cmake --build test/host/build --target $FUZZ_TARGETS
      - name: Fuzz
        # A fixed budget per target, each starting from one valid input to mutate.
        # A finding stops the run, and the input that caused it is kept for
        # replay.
        run: |
          mkdir -p findings
          for target in $FUZZ_TARGETS; do
            test/host/build/$target -max_total_time=60 -dict=test/host/fuzz.dict \
              -seed_inputs=test/host/fuzz_seeds/$target -artifact_prefix=findings/$target-
          done
      - name: Keep findings
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-findings
          path: findings/

  clang-tidy:
    runs-on: ubuntu-24.04
    env:
      # Tidy reads the compile commands this step writes. It must use the test
      # build's compiler, or it lints against a standard library the build never
      # uses.
      CXX: g++-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install clang-tidy
        # Nothing older than 20.1.3 will do: 19 crashes on this code, and 20.1.0 to 20.1.2
        # ignore HeaderFilterRegex in .clang-tidy.
        run: pipx install clang-tidy==22.1.8
      - name: Install CMake
        run: pipx install cmake==3.31.6
      - name: Configure
        run: cmake -S test/host -B test/host/build
      - name: Run clang-tidy
        run: |
          jq -r '.[].file' test/host/build/compile_commands.json \
            | grep -v third_party | sort -u \
            | xargs clang-tidy -p test/host/build -quiet --warnings-as-errors='*'

  firmware-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Use template config
        run: cp main/config.example.hpp main/config.hpp
      - name: Build (prod profile)
        # The image's entrypoint sets up ESP-IDF before running the command.
        run: >
          docker run --rm -e IDF_TARGET=esp32c6 -v "$GITHUB_WORKSPACE:/project" -w /project
          espressif/idf:v5.5.6@sha256:bf72fe7a15c22849a9a94147301165a545fb8905d97c176cf748e3e4614cac84
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.prod" build
